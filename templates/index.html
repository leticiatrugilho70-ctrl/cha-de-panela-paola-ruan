<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{settings.title}} — {{settings.couple}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Italianno&display=swap" rel="stylesheet">
<style>
:root{--p:{{settings.primary}};--s:{{settings.secondary}};--bg:{{settings.background}}}*{box-sizing:border-box}body{margin:0;background:#fbfaf6;color:#263c50;font-family:"Cormorant Garamond",Georgia,serif}.hero{position:relative;overflow:hidden;min-height:340px;background:linear-gradient(180deg,#c9e8f8 0%,#d9eef8 48%,#edf4f4 76%,#fbfaf6 100%);padding:58px 18px 68px;text-align:center}.hero-content{position:relative;z-index:1;max-width:920px;margin:auto}.top-divider{display:none}.hero h1{margin:0 0 18px;text-transform:uppercase;letter-spacing:.12em;font-size:21px;font-weight:600;line-height:1}.hero h2{margin:0;color:#263c50;font-family:Italianno,"Brush Script MT",cursive;font-size:78px;font-weight:400;line-height:.9}.couple{margin-top:10px;font-size:18px;letter-spacing:.025em;text-transform:uppercase}.hero p{max-width:820px;margin:23px auto 0;text-transform:uppercase;letter-spacing:.035em;line-height:1.3;font-size:13px}.wrap{max-width:1180px;margin:auto;padding:20px 18px 60px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:28px 30px}.card{background:#fff;border:1px solid #cddbe5;border-radius:9px;padding:6px;display:flex;flex-direction:column}.pic{aspect-ratio:1.25;background:#eef5f8;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:6px}.pic img{width:100%;height:100%;object-fit:contain;background:#fff}.placeholder{font-size:14px;color:#8394a3;padding:15px;text-align:center}.card-body{padding:7px 1px 0;display:flex;flex-direction:column;gap:6px;flex:1}.name{text-align:center;color:#202c34;font-size:14px;line-height:1.15;min-height:32px}.actions{margin-top:auto;display:grid;gap:6px}.product{color:#557995;font-size:13px;text-align:center;text-decoration:underline;text-underline-offset:2px}button{border:0;border-radius:999px;background:var(--p);color:#fff;padding:9px 8px;font:600 13px "Cormorant Garamond",serif;cursor:pointer}button:disabled{background:#aebfca;cursor:not-allowed}.chosen{opacity:.68}.modal{position:fixed;inset:0;background:#24364688;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.box{width:min(440px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0003}.box h3{font-size:27px;margin:0 0 8px}.box input{width:100%;padding:13px;border:1px solid #cad5de;border-radius:10px;font-size:16px;margin:8px 0 14px}.row{display:flex;gap:9px}.row button{flex:1}.secondary{background:#e7edf2;color:#526a7e}.msg{display:none;padding:11px;border-radius:10px;margin-bottom:10px;background:#eef5f8;font-family:Arial,sans-serif;font-size:13px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.hero{min-height:300px;padding:46px 12px 58px}.hero h1{font-size:15px;letter-spacing:.1em;margin-bottom:16px}.hero h2{font-size:57px}.couple{font-size:15px;margin-top:8px}.hero p{font-size:9px;max-width:76%;margin-top:18px}.grid{grid-template-columns:repeat(2,1fr);gap:14px 12px}.wrap{padding:14px 12px 50px}.name{font-size:13px}.product{font-size:12px}}@media(max-width:390px){.hero h2{font-size:50px}.grid{grid-template-columns:1fr 1fr}.card{padding:5px}}
</style></head><body><header class="hero"><div class="hero-content"><h1>{{settings.title}}</h1><h2>{{settings.subtitle}}</h2><div class="couple">{{settings.couple}}</div><p>{{settings.intro}}</p></div></header><main class="wrap"><section class="grid">{% for g in gifts %}<article class="card {% if g.status=='escolhido' %}chosen{% endif %}" data-id="{{g.id}}"><div class="pic">{% if g.image %}<img src="/{{g.image}}" alt="{{g.name}}">{% else %}<div class="placeholder">Foto do presente</div>{% endif %}</div><div class="card-body"><div class="name">{{g.name}}</div><div class="actions">{% if g.link %}<a class="product" href="{{g.link}}" target="_blank" rel="noopener">Ver produto</a>{% endif %}<button class="choose" {% if g.status=='escolhido' %}disabled{% endif %}>{% if g.status=='escolhido' %}Presente escolhido{% else %}Quero dar este presente{% endif %}</button></div></div></article>{% endfor %}</section></main><div class="modal" id="modal"><div class="box"><h3>Escolher presente</h3><p id="giftName"></p><div class="msg" id="msg"></div><label>Seu nome</label><input id="guestName" placeholder="Digite seu nome"><div class="row"><button class="secondary" id="cancel">Cancelar</button><button id="confirmGift">Confirmar presente</button></div></div></div>
<script>
let selected=null;const modal=document.getElementById('modal'),msg=document.getElementById('msg'),giftName=document.getElementById('giftName'),guestName=document.getElementById('guestName'),cancelBtn=document.getElementById('cancel'),confirmBtn=document.getElementById('confirmGift');function bind(){document.querySelectorAll('.choose:not(:disabled)').forEach(b=>b.onclick=()=>{selected=b.closest('.card');giftName.textContent=selected.querySelector('.name').textContent;guestName.value='';msg.style.display='none';modal.classList.add('open');guestName.focus()})}bind();cancelBtn.onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};confirmBtn.onclick=async()=>{const name=guestName.value.trim();if(!name){msg.textContent='Digite seu nome.';msg.style.display='block';return}confirmBtn.disabled=true;confirmBtn.textContent='Confirmando...';try{const r=await fetch('/api/reserve/'+selected.dataset.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});const d=await r.json();msg.textContent=d.message;msg.style.display='block';if(r.ok){const b=selected.querySelector('.choose');b.disabled=true;b.textContent='Presente escolhido';selected.classList.add('chosen');setTimeout(()=>modal.classList.remove('open'),2200)}}catch(e){msg.textContent='Não foi possível confirmar agora. Tente novamente.';msg.style.display='block'}finally{confirmBtn.disabled=false;confirmBtn.textContent='Confirmar presente'}};setInterval(async()=>{try{const data=await(await fetch('/api/gifts')).json();data.forEach(g=>{const c=document.querySelector(`.card[data-id="${g.id}"]`);if(c&&g.status==='escolhido'){const b=c.querySelector('.choose');b.disabled=true;b.textContent='Presente escolhido';c.classList.add('chosen')}})}catch(e){}},15000);
</script></body></html>
